[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrevn-managed-service"
version = "0.1.0"
description = "HREVN EB1 runtime and AgentProof tooling for verifiable Codex session receipts."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "psycopg[binary]>=3.2.0",
  "reportlab>=4.2.0",
  "web3>=7.12.0",
  "cryptography>=45.0.0",
]

[project.scripts]
hrevn-agentproof = "hrevn_managed_service.cli.agentproof:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
